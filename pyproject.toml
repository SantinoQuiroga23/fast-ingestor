[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fast_ingestor"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=25.0.0",
    "polars>=1.44.2",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "fast_ingestor._lib_ingestor"